name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NOTE: Don't set RUSTFLAGS here — it would override the per-target rustflags
  # from .cargo/config.toml (e.g. -C target-feature=-crt-static for musl, which
  # is required to build cdylib on musl). Pass -D warnings explicitly via
  # `cargo clippy -- -D warnings` instead.

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: math/go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Go 1.22 binaries abort on current macos-latest runners with a
          # missing LC_UUID load command. The module keeps go 1.22 as its
          # minimum language version while CI runs on the supported stable
          # toolchain.
          go-version: stable
          cache-dependency-path: math/go/go.sum

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          working-directory: math/go
          install-go: false

      - name: test (with race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: test
        if: runner.os == 'macOS'
        run: go test -count=1 ./...

  cross-build:
    name: Cross-compile sanity
    runs-on: ubuntu-latest
    needs: [rust, go]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build rust core
        run: cargo zigbuild -p lunarbase-pmm-math --release --target ${{ matrix.target }}

      - name: Build napi addon
        run: cargo zigbuild -p lunarbase-pmm-math-node --release --target ${{ matrix.target }}

      - uses: actions/setup-node@v4
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          node-version: 20

      - name: Build loadable musl NAPI artifact
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: math/rust-node/lunarbase-pmm-math-node
        run: |
          npm ci --ignore-scripts --omit=optional
          CARGO_TARGET_DIR="${{ github.workspace }}/target" npx napi build --platform --release --target x86_64-unknown-linux-musl --zig
          mv -f index.js index.cjs

      - name: Upload musl runtime artifact
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v7
        with:
          name: ci-bindings-x86_64-unknown-linux-musl
          path: |
            math/rust-node/lunarbase-pmm-math-node/lunarbase-pmm-math.linux-x64-musl.node
            math/rust-node/lunarbase-pmm-math-node/index.cjs
            math/rust-node/lunarbase-pmm-math-node/index.d.ts
          if-no-files-found: error
          retention-days: 1

  musl-runtime:
    name: NAPI runtime (node:24-alpine)
    runs-on: ubuntu-latest
    needs: cross-build
    defaults:
      run:
        working-directory: math/rust-node/lunarbase-pmm-math-node
    steps:
      - uses: actions/checkout@v4

      - name: Download musl artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-bindings-x86_64-unknown-linux-musl
          path: math/rust-node/lunarbase-pmm-math-node/artifacts/musl

      - name: Restore generated loader and native addon
        run: |
          cp artifacts/musl/index.cjs index.cjs
          cp artifacts/musl/index.d.ts index.d.ts
          cp artifacts/musl/lunarbase-pmm-math.linux-x64-musl.node .

      - name: Run deterministic and fuzz-vector Node tests
        run: docker run --rm --platform linux/amd64 -v "${{ github.workspace }}:/repo" -w /repo/math/rust-node/lunarbase-pmm-math-node node:24-alpine node --test test/quote.test.mjs

  examples:
    name: Examples smoke test
    runs-on: ubuntu-latest
    needs: [rust, go]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            math/go/go.sum
            examples/minimal/go/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Rust minimal example
        run: cargo run --manifest-path examples/minimal/rust/Cargo.toml
      - name: Rust offchain quoting examples
        run: cargo check --locked -p offchain-quoting-example-rust
      - name: Go minimal example
        run: |
          cd examples/minimal/go
          go mod tidy
          go run .

  audit:
    name: Security advisories (cargo-deny)
    runs-on: ubuntu-latest
    # Advisories are informational and shouldn't block merges; the job still
    # shows red on the PR if a vulnerable dep is in Cargo.lock.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
