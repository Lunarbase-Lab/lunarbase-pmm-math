[package]
name = "lunarbase-pmm-math"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure Rust mirror of LunarBase linear anchor quotes and directional punishment transitions."
readme = "README.md"
keywords = ["lunarbase", "pmm", "amm", "defi", "math"]
categories = ["mathematics", "no-std::no-alloc"]
# Solidity-oracle parity fixtures are test-only and excluded from published crates.
exclude = [
    "deterministic_vectors.jsonl",
    "fuzz_vectors.jsonl",
    "tests/solidity_vectors.rs",
    "benches/",
    ".bench-baseline.txt",
]

[lib]
crate-type = ["rlib"]

[dependencies]
ruint = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { workspace = true }
serde_json = "1"

[[bench]]
name = "quote"
harness = false

[lints]
workspace = true
